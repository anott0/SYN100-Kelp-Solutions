<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelp Genetics & Ocean Warming</title>
<style>
  :root {
    --bg: #081826;
    --panel: #0f2537;
    --border: #1e425e;
    --text: #e6f4f1;
    --muted: #8ab4c9;
    --accent: #2dd4bf;
    --warn: #f59e0b;
    --danger: #f43f5e;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .title-group h1 { margin: 0; font-size: 16px; font-weight: 700; color: var(--accent); }
  .title-group p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .metrics { display: flex; gap: 20px; }
  .metric { text-align: right; }
  .metric span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .metric strong { font-size: 18px; color: var(--text); }

  #viewport { position: relative; flex: 1; width: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }

  .dna-dock {
    position: absolute; top: 14px; left: 16px;
    background: rgba(15, 37, 55, 0.9); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px);
    max-width: 340px;
  }
  .dna-dock h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
  .strand { display: flex; gap: 8px; margin-bottom: 10px; }
  .locus {
    flex: 1; padding: 8px; border-radius: 6px; text-align: center;
    background: #091926; border: 1px dashed var(--muted); transition: 0.2s;
  }
  .locus.modified { border: 1px solid var(--accent); background: rgba(45, 212, 191, 0.12); }
  .locus small { display: block; font-size: 10px; color: var(--muted); }
  .locus strong { font-size: 15px; color: var(--text); }
  .locus.modified strong { color: var(--accent); }

  .alleles { display: flex; gap: 6px; flex-wrap: wrap; }
  .allele-btn {
    flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 600;
    background: #14344d; color: var(--text); border: 1px solid var(--accent);
    border-radius: 6px; cursor: pointer; transition: 0.15s;
  }
  .allele-btn:hover:not(:disabled) { background: var(--accent); color: #042f2e; }
  .allele-btn:disabled { opacity: 0.4; cursor: default; border-color: var(--border); }

  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 20px; background: var(--panel); border-top: 1px solid var(--border);
  }
  .control-group { display: flex; align-items: center; gap: 12px; flex: 1; }
  label { font-size: 13px; font-weight: 600; white-space: nowrap; }
  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .reset-btn {
    padding: 7px 14px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>1. Heat-Tolerant Genetics (SNP Modification)</h1>
    <p>Substitute heat-shock alleles to stabilize kelp membranes during marine heatwaves</p>
  </div>
  <div class="metrics">
    <div class="metric">
      <span>Thermal Tolerance</span>
      <strong id="tolVal">15°C Max</strong>
    </div>
    <div class="metric">
      <span>Kelp Survival</span>
      <strong id="survVal" style="color: #2dd4bf;">100%</strong>
    </div>
  </div>
</header>

<div id="viewport">
  <canvas id="ocean"></canvas>
  <div class="dna-dock">
    <h3>Target Thermal Loci (Click to Substitute)</h3>
    <div class="strand">
      <div class="locus" id="loc0"><small>HSP70 Locus</small><strong>A - T</strong></div>
      <div class="locus" id="loc1"><small>Membrane SNP</small><strong>C - G</strong></div>
      <div class="locus" id="loc2"><small>Chloroplast</small><strong>G - C</strong></div>
    </div>
    <div class="alleles">
      <button class="allele-btn" id="btn0" onclick="applySNP(0, 'G - C')">+ Insert G-C</button>
      <button class="allele-btn" id="btn1" onclick="applySNP(1, 'T - A')">+ Insert T-A</button>
      <button class="allele-btn" id="btn2" onclick="applySNP(2, 'A - T')">+ Insert A-T</button>
    </div>
  </div>
</div>

<footer>
  <div class="control-group">
    <label for="tempSlider">Ocean Temperature: <span id="tempLabel">14°C</span></label>
    <input type="range" id="tempSlider" min="12" max="24" step="0.5" value="14" />
  </div>
  <button class="reset-btn" onclick="resetSim()">Reset Wild-Type</button>
</footer>

<script>
  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');
  let width, height;

  let temp = 14;
  let mods = [false, false, false];
  let kelps = [];
  let time = 0;

  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
    initKelp();
  }
  window.addEventListener('resize', resize);

  function initKelp() {
    kelps = [];
    const count = Math.floor(width / 36);
    for (let i = 0; i < count; i++) {
      kelps.push({
        x: 25 + i * 36 + (Math.random() * 14 - 7),
        maxH: height * (0.55 + Math.random() * 0.25),
        health: 1,
        phase: Math.random() * Math.PI * 2,
        blades: 8 + Math.floor(Math.random() * 5)
      });
    }
  }

  function applySNP(idx, pair) {
    mods[idx] = true;
    const loc = document.getElementById('loc' + idx);
    loc.classList.add('modified');
    loc.querySelector('strong').textContent = pair;
    document.getElementById('btn' + idx).disabled = true;
    updateStats();
  }

  function resetSim() {
    mods = [false, false, false];
    temp = 14;
    document.getElementById('tempSlider').value = 14;
    document.getElementById('tempLabel').textContent = '14°C';
    const defaults = ['A - T', 'C - G', 'G - C'];
    for (let i = 0; i < 3; i++) {
      const loc = document.getElementById('loc' + i);
      loc.classList.remove('modified');
      loc.querySelector('strong').textContent = defaults[i];
      document.getElementById('btn' + i).disabled = false;
    }
    updateStats();
  }

  document.getElementById('tempSlider').addEventListener('input', (e) => {
    temp = parseFloat(e.target.value);
    document.getElementById('tempLabel').textContent = temp.toFixed(1) + '°C';
    updateStats();
  });

  function getSurvivalRate() {
    const modCount = mods.filter(Boolean).length;
    const maxSafeTemp = 15 + modCount * 2.7; // Up to 23.1°C with all 3 SNPs
    if (temp <= maxSafeTemp) return 1.0;
    const excess = temp - maxSafeTemp;
    return Math.max(0.05, 1 - excess * 0.22);
  }

  function updateStats() {
    const modCount = mods.filter(Boolean).length;
    const maxSafeTemp = (15 + modCount * 2.7).toFixed(1);
    const surv = Math.round(getSurvivalRate() * 100);
    document.getElementById('tolVal').textContent = maxSafeTemp + '°C Max';
    const survEl = document.getElementById('survVal');
    survEl.textContent = surv + '%';
    survEl.style.color = surv > 70 ? '#2dd4bf' : surv > 35 ? '#f59e0b' : '#f43f5e';
  }

  function draw() {
    time += 0.03;
    const heatFactor = Math.max(0, (temp - 14) / 10);
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, `rgb(${12 + heatFactor * 70}, ${65 - heatFactor * 20}, ${95 - heatFactor * 35})`);
    grad.addColorStop(1, '#040d14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Seafloor reef
    ctx.fillStyle = '#0b1924';
    ctx.fillRect(0, height - 28, width, 28);

    const targetHealth = getSurvivalRate();

    kelps.forEach((k) => {
      k.health += (targetHealth - k.health) * 0.04;
      const currentH = k.maxH * (0.2 + 0.8 * k.health);
      const baseX = k.x;
      const baseY = height - 26;

      // Color shifts from vibrant emerald to bleached olive/brown under stress
      const r = Math.round(35 + (1 - k.health) * 140);
      const g = Math.round(185 * k.health + 110 * (1 - k.health));
      const b = Math.round(115 * k.health + 55 * (1 - k.health));
      const color = `rgb(${r},${g},${b})`;

      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);

      const segments = 12;
      for (let s = 1; s <= segments; s++) {
        const frac = s / segments;
        const sway = Math.sin(time + k.phase + frac * 3) * (14 * frac);
        const px = baseX + sway;
        const py = baseY - currentH * frac;
        ctx.lineTo(px, py);

        if (s > 2 && s % 2 === 0 && k.health > 0.15) {
          ctx.save();
          ctx.fillStyle = color;
          ctx.beginPath();
          const dir = (s % 4 === 0) ? 1 : -1;
          ctx.ellipse(px + dir * 12 * k.health, py, 14 * k.health, 4 * k.health, dir * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.stroke();
    });

    requestAnimationFrame(draw);
  }

  resize();
  updateStats();
  draw();
</script>
</body>
</html>
