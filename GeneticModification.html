<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelp Genetics & Ocean Warming</title>
<style>
  :root {
    --bg: #0b1922;
    --panel: #13222c;
    --border: #1e3545;
    --text: #e6f4f1;
    --muted: #8ab4c9;
    --accent: #2dd4bf;
    --warn: #f59e0b;
    --danger: #f43f5e;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .title-group h1 { margin: 0; font-size: 16px; font-weight: 700; color: var(--accent); }
  .title-group p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .metrics { display: flex; gap: 20px; }
  .metric { text-align: right; }
  .metric span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .metric strong { font-size: 18px; color: var(--text); }

  #viewport { position: relative; flex: 1; width: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }

  .dna-dock {
    position: absolute; top: 16px; left: 18px;
    background: rgba(15, 32, 43, 0.92); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(6px);
    width: 340px;
  }
  .dna-dock h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
  .strand { display: flex; gap: 8px; margin-bottom: 10px; }
  .locus {
    flex: 1; padding: 8px 6px; border-radius: 6px; text-align: center;
    background: #09151e; border: 1.5px dashed var(--muted); transition: 0.2s;
  }
  .locus.drag-over { border-color: var(--accent); background: rgba(45, 212, 191, 0.22); transform: scale(1.03); }
  .locus.modified { border: 1.5px solid var(--accent); background: rgba(45, 212, 191, 0.14); }
  .locus small { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .locus strong { font-size: 14px; color: var(--text); }
  .locus.modified strong { color: var(--accent); }

  .alleles { display: flex; gap: 8px; }
  .allele-tile {
    flex: 1; padding: 7px 6px; font-size: 12px; font-weight: 700; text-align: center;
    background: #14344d; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 6px; cursor: grab; user-select: none; transition: 0.15s;
  }
  .allele-tile:hover:not(.used) { background: var(--accent); color: #042f2e; }
  .allele-tile.used { opacity: 0.35; cursor: default; pointer-events: none; border-color: var(--border); color: var(--muted); }

  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 20px; background: var(--panel); border-top: 1px solid var(--border);
  }
  .control-group { display: flex; align-items: center; gap: 12px; flex: 1; }
  label { font-size: 13px; font-weight: 600; white-space: nowrap; }
  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .reset-btn {
    padding: 7px 14px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>1. Heat-Tolerant Genetics (SNP Modification)</h1>
    <p>Drag heat-resistant base pairs onto the DNA strand (or click) to boost thermal resilience</p>
  </div>
  <div class="metrics">
    <div class="metric">
      <span>Thermal Limit</span>
      <strong id="tolVal">15.0°C</strong>
    </div>
    <div class="metric">
      <span>Kelp Survival</span>
      <strong id="survVal" style="color: #4ade80;">100%</strong>
    </div>
  </div>
</header>

<div id="viewport">
  <canvas id="ocean"></canvas>
  <div class="dna-dock">
    <h3>Genetic Cell Lab — Drag Base Pairs</h3>
    <div class="strand">
      <div class="locus" id="loc0" data-idx="0"><small>HSP70 Locus</small><strong>A - T</strong></div>
      <div class="locus" id="loc1" data-idx="1"><small>Membrane SNP</small><strong>C - G</strong></div>
      <div class="locus" id="loc2" data-idx="2"><small>Chloroplast</small><strong>G - C</strong></div>
    </div>
    <div class="alleles">
      <div class="allele-tile" id="tile0" draggable="true" data-idx="0" data-pair="G - C">G - C</div>
      <div class="allele-tile" id="tile1" draggable="true" data-idx="1" data-pair="T - A">T - A</div>
      <div class="allele-tile" id="tile2" draggable="true" data-idx="2" data-pair="A - T">A - T</div>
    </div>
  </div>
</div>

<footer>
  <div class="control-group">
    <label for="tempSlider">Water Temp: <span id="tempLabel">14.0°C</span></label>
    <input type="range" id="tempSlider" min="12" max="24" step="0.5" value="14" />
  </div>
  <button class="reset-btn" onclick="resetSim()">Reset Wild-Type</button>
</footer>

<script>
  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');
  let width, height;

  let temp = 14;
  let mods = [false, false, false];
  let kelps = [];
  let spores = [];
  let time = 0;

  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
    initScene();
  }
  window.addEventListener('resize', resize);

  function initScene() {
    kelps = [];
    const spacing = 75;
    const count = Math.max(5, Math.floor((width - 280) / spacing));
    const startX = Math.min(380, width * 0.36);
    for (let i = 0; i < count; i++) {
      kelps.push({
        x: startX + i * spacing + (Math.random() * 18 - 9),
        maxH: height * (0.62 + Math.random() * 0.24),
        health: 1,
        phase: Math.random() * Math.PI * 2
      });
    }
    spores = Array.from({ length: 24 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: 1.5 + Math.random() * 2,
      vy: 0.25 + Math.random() * 0.4
    }));
  }

  function applySNP(idx, pair) {
    if (mods[idx]) return;
    mods[idx] = true;
    const loc = document.getElementById('loc' + idx);
    loc.classList.add('modified');
    loc.querySelector('strong').textContent = pair;
    document.getElementById('tile' + idx).classList.add('used');
    updateStats();
  }

  document.querySelectorAll('.allele-tile').forEach(tile => {
    tile.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', tile.dataset.idx);
    });
    tile.addEventListener('click', () => {
      applySNP(parseInt(tile.dataset.idx), tile.dataset.pair);
    });
  });

  document.querySelectorAll('.locus').forEach(loc => {
    loc.addEventListener('dragover', e => {
      e.preventDefault();
      loc.classList.add('drag-over');
    });
    loc.addEventListener('dragleave', () => loc.classList.remove('drag-over'));
    loc.addEventListener('drop', e => {
      e.preventDefault();
      loc.classList.remove('drag-over');
      const idx = parseInt(e.dataTransfer.getData('text/plain'));
      const tile = document.getElementById('tile' + idx);
      if (tile) applySNP(idx, tile.dataset.pair);
    });
  });

  function resetSim() {
    mods = [false, false, false];
    temp = 14;
    document.getElementById('tempSlider').value = 14;
    document.getElementById('tempLabel').textContent = '14.0°C';
    const defaults = ['A - T', 'C - G', 'G - C'];
    for (let i = 0; i < 3; i++) {
      const loc = document.getElementById('loc' + i);
      loc.classList.remove('modified');
      loc.querySelector('strong').textContent = defaults[i];
      document.getElementById('tile' + i).classList.remove('used');
    }
    updateStats();
  }

  document.getElementById('tempSlider').addEventListener('input', e => {
    temp = parseFloat(e.target.value);
    document.getElementById('tempLabel').textContent = temp.toFixed(1) + '°C';
    updateStats();
  });

  function getSurvivalRate() {
    const modCount = mods.filter(Boolean).length;
    const maxSafeTemp = 15 + modCount * 2.85;
    if (temp <= maxSafeTemp) return 1.0;
    return Math.max(0.08, 1 - (temp - maxSafeTemp) * 0.22);
  }

  function updateStats() {
    const modCount = mods.filter(Boolean).length;
    const maxSafeTemp = (15 + modCount * 2.85).toFixed(1);
    const surv = Math.round(getSurvivalRate() * 100);
    document.getElementById('tolVal').textContent = maxSafeTemp + '°C';
    const survEl = document.getElementById('survVal');
    survEl.textContent = surv + '%';
    survEl.style.color = surv > 70 ? '#4ade80' : surv > 35 ? '#f59e0b' : '#f43f5e';
  }

  function drawGiantKelp(x, baseY, maxH, health, phase) {
    const currentH = maxH * (0.18 + 0.82 * health);
    // Olive-emerald healthy tone shifting to bleached tan under heat stress
    const r = Math.round(92 * health + 165 * (1 - health));
    const g = Math.round(145 * health + 135 * (1 - health));
    const b = Math.round(44 * health + 75 * (1 - health));
    const stemColor = `rgb(${r},${g},${b})`;
    const bladeFill = `rgba(${Math.min(255, r + 12)},${Math.min(255, g + 16)},${b}, 0.92)`;

    const segments = 16;
    const pts = [];
    for (let s = 0; s <= segments; s++) {
      const frac = s / segments;
      const sway = Math.sin(time + phase + frac * 3.4) * (18 * frac);
      pts.push({ x: x + sway, y: baseY - currentH * frac });
    }

    // Central stipe (continuous line from seabed)
    ctx.strokeStyle = stemColor;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts.x, pts.y);
    for (let s = 1; s < pts.length; s++) {
      ctx.lineTo(pts[s].x, pts[s].y);
    }
    ctx.stroke();

    // Alternating curved teardrop blades + pneumatocysts
    if (health > 0.14) {
      for (let s = 2; s < pts.length; s += 2) {
