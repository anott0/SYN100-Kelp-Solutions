<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelp Genetics & Ocean Warming</title>
<style>
  :root {
    --bg: #0b1319;
    --card: #121e27;
    --panel: #182631;
    --border: #243847;
    --text: #f0f7fa;
    --muted: #8ea4b5;
    --accent: #2dd4bf;
    --green: #4ade80;
    --warn: #f59e0b;
    --danger: #f43f5e;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; min-height: 100vh; padding: 14px;
    gap: 12px;
  }

  /* Main Ecosystem Viewport Card */
  .viewport-card {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; height: 340px; flex-shrink: 0;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .status-header {
    position: absolute; top: 18px; left: 22px; pointer-events: none;
  }
  .status-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .status-header h1 { margin: 0; font-size: 20px; font-weight: 700; color: #fff; }

  /* Genetic Cell Lab Overlay */
  .cell-lab {
    position: absolute; top: 82px; left: 22px; width: 175px;
    background: rgba(13, 25, 34, 0.88); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; text-align: center;
    backdrop-filter: blur(6px);
  }
  .cell-lab h3 {
    margin: 0 0 10px; font-size: 10px; letter-spacing: 0.7px;
    text-transform: uppercase; color: var(--muted); text-align: left;
  }
  .ring-wrap {
    position: relative; width: 92px; height: 92px; margin: 0 auto 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-wrap svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: #1e3545; stroke-width: 3; stroke-dasharray: 3 3; }
  .ring-fg {
    fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round;
    transition: stroke-dashoffset 0.35s ease;
  }
  .ring-title { font-size: 11px; font-weight: 700; color: #fff; }
  .ring-sub { font-size: 10px; font-weight: 600; color: var(--accent); margin-top: 2px; }
  .lab-bar {
    height: 4px; width: 100%; background: #1e3545; border-radius: 99px; overflow: hidden;
  }
  .lab-bar-fill {
    height: 100%; width: 0%; background: #0284c7; transition: width 0.35s ease;
  }

  /* Thermal Protection Allele Pill */
  .allele-status {
    position: absolute; bottom: 18px; right: 20px;
    background: rgba(13, 25, 34, 0.92); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(6px);
  }
  .allele-status span { font-size: 12px; font-weight: 600; color: var(--text); }
  .badge {
    padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700;
    background: #1e3545; color: var(--muted); transition: 0.25s;
  }
  .badge.active { background: #22c55e; color: #052e16; }

  /* Metrics Row */
  .metrics-bar {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; text-align: center;
  }
  .metric-box span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .metric-box strong { font-size: 18px; font-weight: 700; color: #fff; }

  /* Bottom Controls & Promoter SNP Sequencer */
  .sequencer-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .seq-top {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .seq-top h2 { margin: 0; font-size: 14px; font-weight: 700; color: #fff; }
  .seq-top p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .base-row {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px;
  }
  .base-btn {
    background: #0d1922; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 8px 4px; text-align: center; cursor: pointer; transition: 0.15s;
  }
  .base-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .base-btn.target { border-style: dashed; border-color: var(--warn); }
  .base-btn.mutated {
    border-style: solid; border-color: var(--green);
    background: rgba(74, 222, 128, 0.14);
  }
  .base-btn small { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .base-btn strong { font-size: 14px; color: #fff; }
  .base-btn.mutated strong { color: var(--green); }

  .temp-controls {
    display: flex; align-items: center; gap: 14px;
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .temp-controls label { font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--text); }
  .temp-controls input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .reset-btn {
    padding: 6px 12px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .reset-btn:hover { color: #fff; border-color: #fff; }
</style>
</head>
<body>

<div class="viewport-card">
  <canvas id="ocean"></canvas>

  <div class="status-header">
    <div class="status-pill"><span class="status-dot" id="statusDot"></span> OCEAN ECOSYSTEM STATUS</div>
    <h1 id="canopyHeadline">Healthy Kelp Canopy</h1>
  </div>

  <div class="cell-lab">
    <h3>Genetic Cell Lab</h3>
    <div class="ring-wrap">
      <svg viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="42" />
        <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264" />
      </svg>
      <div class="ring-title">Hsp70 Allele</div>
      <div class="ring-sub" id="modPctLabel">0% Modified</div>
    </div>
    <div class="lab-bar"><div class="lab-bar-fill" id="labBarFill"></div></div>
  </div>

  <div class="allele-status">
    <span>Thermal Protection Allele</span>
    <div class="badge" id="alleleBadge">Wild-Type</div>
  </div>
</div>

<div class="metrics-bar">
  <div class="metric-box">
    <span>Water Temp</span>
    <strong id="tempMetric">15.0 °C</strong>
  </div>
  <div class="metric-box">
    <span>Kelp Survival</span>
    <strong id="survMetric" style="color: #4ade80;">100%</strong>
  </div>
  <div class="metric-box">
    <span>Thermal Limit</span>
    <strong id="limitMetric">16.5 °C</strong>
  </div>
</div>

<div class="sequencer-card">
  <div class="seq-top">
    <div>
      <h2>Target Promoter SNP Sequencing</h2>
      <p id="seqInstruction">Click highlighted bases (#2, #5, #7) to substitute heat-shock activator SNPs</p>
    </div>
    <button class="reset-btn" onclick="resetAll()">Reset Genome</button>
  </div>

  <div class="base-row" id="baseRow"></div>

  <div class="temp-controls">
    <label for="tempSlider">Simulate Ocean Warming:</label>
    <input type="range" id="tempSlider" min="13" max="24.5" step="0.5" value="15" />
  </div>
</div>

<script>
  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');
  let width, height;

  // 8-base promoter sequence; indices 1 (#2), 4 (#5), and 6 (#7) are key thermal SNP targets
  const initialSequence = [
    { pos: '#1', wt: 'G', mut: 'G', isTarget: false },
    { pos: '#2', wt: 'A', mut: 'G', isTarget: true },
    { pos: '#3', wt: 'T', mut: 'T', isTarget: false },
    { pos: '#4', wt: 'C', mut: 'C', isTarget: false },
    { pos: '#5', wt: 'A', mut: 'C', isTarget: true },
    { pos: '#6', wt: 'G', mut: 'G', isTarget: false },
    { pos: '#7', wt: 'T', mut: 'A', isTarget: true },
    { pos: '#8', wt: 'C', mut: 'C', isTarget: false }
  ];

  let mutatedState = initialSequence.map(() => false);
  let temp = 15.0;
  let kelps = [];
  let spores = [];
  let time = 0;

  function renderBases() {
    const row = document.getElementById('baseRow');
    row.innerHTML = '';
    initialSequence.forEach((b, idx) => {
      const btn = document.createElement('button');
      btn.className = 'base-btn' + (b.isTarget ? ' target' : '') + (mutatedState[idx] ? ' mutated' : '');
      const val = mutatedState[idx] ? b.mut : b.wt;
      btn.innerHTML = `<small>${b.pos}</small><strong>${val}</strong>`;
      btn.onclick = () => {
        if (!b.isTarget) return;
        mutatedState[idx] = !mutatedState[idx];
        renderBases();
        updateDashboard();
      };
      row.appendChild(btn);
    });
  }

  function getModProgress() {
    const targets = initialSequence.filter(b => b.isTarget).length;
    const active = initialSequence.filter((b, i) => b.isTarget && mutatedState[i]).length;
    return active / targets;
  }

  function getThermalLimit() {
    return 16.5 + getModProgress() * 7.0; // Scales from 16.5°C up to 23.5°C
  }

  function getSurvival() {
    const limit = getThermalLimit();
    if (temp <= limit) return 1.0;
    return Math.max(0.08, 1 - (temp - limit) * 0.24);
  }

  function updateDashboard() {
    const prog = getModProgress();
    const pct = Math.round(prog * 100);
    const limit = getThermalLimit();
    const surv = Math.round(getSurvival() * 100);

    // Update circular ring & bar
    const circumference = 264;
    document.getElementById('ringFg').style.strokeDashoffset = circumference * (1 - prog);
    document.getElementById('modPctLabel').textContent = `${pct}% Modified`;
    document.getElementById('labBarFill').style.width = `${pct}%`;

    // Update Allele badge

    const badge = document.getElementById('alleleBadge');
if (pct === 100) {
badge.textContent = 'Inserted';
badge.className = 'badge active';
} else if (pct > 0) {
badge.textContent = 'Partial';
badge.className = 'badge';
} else {
badge.textContent = 'Wild-Type';
badge.className = 'badge';
}
// Update metrics
document.getElementById('tempMetric').textContent = ${temp.toFixed(1)} °C;
document.getElementById('limitMetric').textContent = ${limit.toFixed(1)} °C;
const survEl = document.getElementById('survMetric');
survEl.textContent = ${surv}%;
survEl.style.color = surv > 70 ? '#4ade80' : surv > 35 ? '#f59e0b' : '#f43f5e';
// Update ecosystem headline
const headline = document.getElementById('canopyHeadline');
const dot = document.getElementById('statusDot');
if (surv > 70) {
headline.textContent = 'Healthy Kelp Canopy';
dot.style.background = '#2dd4bf';
dot.style.boxShadow = '0 0 8px #2dd4bf';
} else if (surv > 35) {
headline.textContent = 'Thermal Stress & Bleaching';
dot.style.background = '#f59e0b';
dot.style.boxShadow = '0 0 8px #f59e0b';
} else {
headline.textContent = 'Severe Canopy Die-Off';
dot.style.background = '#f43f5e';
dot.style.boxShadow = '0 0 8px #f43f5e';
}
}
function resetAll() {
mutatedState = initialSequence.map(() => false);
temp = 15.0;
document.getElementById('tempSlider').value = 15.0;
renderBases();
updateDashboard();
}
document.getElementById('tempSlider').addEventListener('input', e => {
temp = parseFloat(e.target.value);
updateDashboard();
});
function resize() {
width = canvas.width = canvas.parentElement.clientWidth;
height = canvas.height = canvas.parentElement.clientHeight;
initScene();
}
window.addEventListener('resize', resize);
function initScene() {
kelps = [];
const startX = Math.min(255, width * 0.34);
const spacing = 74;
const count = Math.max(5, Math.floor((width - startX - 20) / spacing));
for (let i = 0; i < count; i++) {
kelps.push({
x: startX + i * spacing + (Math.random() * 14 - 7),
maxH: height * (0.72 + Math.random() * 0.2),
health: 1,
phase: Math.random() * Math.PI * 2
});
}
spores = Array.from({ length: 24 }, () => ({
x: Math.random() * width,
y: Math.random() * height,
r: 1.5 + Math.random() * 1.8,
vy: 0.25 + Math.random() * 0.35
}));
}
function drawGiantKelp(x, baseY, maxH, health, phase) {
const currentH = maxH * (0.2 + 0.8 * health);
const r = Math.round(92 * health + 165 * (1 - health));
const g = Math.round(145 * health + 135 * (1 - health));
const b = Math.round(44 * health + 75 * (1 - health));
const stemColor = rgb(${r},${g},${b});
const bladeFill = rgba(${Math.min(255, r + 12)},${Math.min(255, g + 16)},${b}, 0.92);
const segments = 16;
const pts = [];
for (let s = 0; s <= segments; s++) {
const frac = s / segments;
const sway = Math.sin(time + phase + frac * 3.4) * (16 * frac);
pts.push({ x: x + sway, y: baseY - currentH * frac });
}
// Continuous central kelp stipe (stalk)
ctx.strokeStyle = stemColor;
ctx.lineWidth = 3.2;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(pts[0].x, pts[0].y);
for (let s = 1; s < pts.length; s++) {
ctx.lineTo(pts[s].x, pts[s].y);
}
ctx.stroke();
// Alternating curved teardrop blades + pneumatocysts
if (health > 0.14) {
for (let s = 2; s < pts.length; s += 2) {
const dir = (s % 4 === 0) ? 1 : -1;
const p = pts[s];
const scale = (0.75 + 0.35 * (1 - s / segments)) * health;
const len = 24 * scale;
const wid = 8.5 * scale;
ctx.save();
ctx.translate(p.x, p.y);
ctx.rotate(dir * 0.25 + Math.sin(time * 1.4 + phase + s) * 0.08);
ctx.fillStyle = stemColor;
ctx.beginPath();
ctx.arc(dir * 3.5 * scale, -1, 2.8 * scale, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = bladeFill;
ctx.beginPath();
ctx.moveTo(dir * 5 * scale, -1);
ctx.bezierCurveTo(
dir * (len * 0.45), -wid * 1.3,
dir * (len * 0.95), -wid * 0.5,
dir * len, wid * 0.45
);
ctx.bezierCurveTo(
dir * (len * 0.65), wid * 0.95,
dir * (len * 0.25), wid * 0.55,
dir * 5 * scale, -1
);
ctx.fill();
ctx.restore();
}
}
}
function draw() {
time += 0.025;
const heatFactor = Math.max(0, (temp - 15) / 9.5);
const grad = ctx.createLinearGradient(0, 0, 0, height);
grad.addColorStop(0, rgb(${14 + heatFactor * 52}, ${42 - heatFactor * 12}, ${52 - heatFactor * 18}));
grad.addColorStop(1, '#07131a');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, width, height);
ctx.fillStyle = 'rgba(134, 239, 172, 0.22)';
spores.forEach(s => {
s.y -= s.vy;
if (s.y < 0) { s.y = height - 18; s.x = Math.random() * width; }
ctx.beginPath();
ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
ctx.fill();
});
ctx.fillStyle = '#09151d';
ctx.fillRect(0, height - 16, width, 16);
const targetHealth = getSurvival();
kelps.forEach(k => {
k.health += (targetHealth - k.health) * 0.04;
drawGiantKelp(k.x, height - 15, k.maxH, k.health, k.phase);
});
requestAnimationFrame(draw);
}
renderBases();
resize();
updateDashboard();
draw();
